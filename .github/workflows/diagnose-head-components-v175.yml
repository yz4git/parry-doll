name: Diagnose donor head components v17.5

on:
  push:
    branches: [main]
    paths:
      - '.github/diagnose-head-components-v175.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Diagnose connected components in generated donor head
        run: |
          blender --background --python-exit-code 1 --python tools/diagnose-head-components-v175.py
