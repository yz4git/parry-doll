name: Dodge system v1
on:
  push:
    branches: [main]
    paths:
      - '.github/dodge-system-v1.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dodge system integration
        run: python3 tools/apply-dodge-system-v1.py
      - name: Validate JavaScript syntax
        run: |
          node --check dist/game.js
          node --check dist/dodge-system-v1.js
          node --check dist/combat-director-v2.js
          node --check dist/combat-product-pass.js
      - name: Validate dodge invariants
        run: |
          grep -q "response:'dodge'" dist/dodge-system-v1.js
          test "$(grep -o "response:'dodge'" dist/dodge-system-v1.js | wc -l)" -ge 8
          grep -q "dodgeSystem.src='./dodge-system-v1.js" dist/index.html
          grep -q "シアンの≫攻撃は回避専用" dist/index.html
          grep -q "boss.sequence%ENEMY_MOVES\[level\].length" dist/game.js
          grep -q "lastResponse" dist/combat-director-v2.js
          grep -q "≫ DODGE" dist/combat-product-pass.js
      - name: Commit dodge combat system
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/game.js dist/index.html dist/dodge-system-v1.js dist/combat-director-v2.js dist/combat-product-pass.js
          git commit -m 'feat: add dodge-only boss attacks and dodge input'
          git push
