name: MIRROR BREAK v14 Ruin Finisher Audit

on:
  push:
    branches: [main]
    paths:
      - dist/mirror-break-v14-ruin-finisher.js
      - dist/mirror-break-v13-chain-destruction.js
      - .github/workflows/mirror-break-v14-ruin-finisher-audit.yml

permissions:
  contents: read

jobs:
  ruin-finisher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate v14
        run: |
          node --check dist/mirror-break-v13-chain-destruction.js
          node --check dist/mirror-break-v14-ruin-finisher.js
      - name: Install iPhone WebKit stack
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve game
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/parry-v14-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/parry-v14-http.log; exit 1
      - name: Verify four ruin finishers
        run: |
          mkdir -p mirror-break-v14-audit
          cat > v14-audit.cjs <<'NODE'
          const { webkit }=require('playwright');const fs=require('fs');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({viewport:{width:852,height:393},isMobile:true,hasTouch:true,deviceScaleFactor:1,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
            const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('Failed to load resource'))errors.push('console: '+m.text())});page.on('response',r=>{if(r.status()>=400&&!r.url().includes('/version.json'))errors.push(`HTTP ${r.status()} ${r.url()}`)});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.parryMirrorBreakDiagnostics?.().v14===true,null,{timeout:60000,polling:100});await page.evaluate(()=>document.getElementById('start')?.click());await sleep(350);
            const names=['ASH GATE','CAGE BREACH','BROKEN SPINE','ALTAR RIFT'],finish=['GATE SPLIT','CAGE CRUSH','SPINE CLEAVE','ALTAR SHATTER'],styles=['BLADELESS SPIN CRASH','HOLLOW TUMBLE','FIVE-LEG CARTWHEEL','BELL TOWER COLLAPSE'],damage=[8,11,14,17],rows=[];
            for(let source=0;source<4;source++){
              await page.evaluate(({source,style,hp})=>{const hit={serial:1700+source,level:source,style,part:['swordArm','foreLeg','spearLeg','bellArm'][source],kind:['ARM','LEG','LEG','ARM'][source],label:'v14-finisher',x:(source-1.5)*.7,z:-2.2-source*.2,power:2.2+source*.2,time:performance.now()};window.__mirrorBreakV9State.stageHitSerial=hit.serial;window.__mirrorBreakV9State.stageHit=hit;reset(source+1);mode='play';transition=0;player.hp=100;player.invuln=10;player.stun=0;boss.hp=hp;boss.invuln=0;boss.ai=999;boss.wind=0;boss.strike=0;boss.stun=0;boss.down=0;boss.pattern=null;window.__mirrorBreakState.broken=true;window.__mirrorBreakState.boss=boss},{source,style:styles[source],hp:damage[source]+4});
              await sleep(380);
              const before=await page.evaluate(()=>window.parryMirrorBreakDiagnostics());if(before.routeName!==names[source]||!before.v14)throw new Error('route/v14 not ready '+JSON.stringify({source,before}));
              await page.evaluate(source=>{const t=source===3?{x:0,z:-4.05}:{x:(source%2?1:-1)*3.6,z:-5.35},ch=boss.nodes.find(n=>n.name==='chest')||boss.nodes[0];boss.invuln=0;hurt(boss,1,V(29+source*2,4,-3),ch.p);const dx=t.x-ch.p.x,dz=t.z-ch.p.z;boss.pos.x+=dx;boss.pos.z+=dz;for(const n of boss.nodes){n.p.x+=dx;n.prev.x+=dx;n.p.z+=dz;n.prev.z+=dz}step(1/60)},source);
              await sleep(260);
              const after=await page.evaluate(()=>({d:window.parryMirrorBreakDiagnostics(),hp:boss.hp,hud:document.getElementById('mbRuinFinisher')?.textContent||'',body:document.body.className}));
              if(after.d.chainTriggers!==source+1)throw new Error('chain missing '+JSON.stringify({source,after}));if(after.d.ruinFinishers!==source+1)throw new Error('finisher missing '+JSON.stringify({source,after}));if(after.d.ruinFinisherLast?.source!==source||after.d.ruinFinisherLast?.name!==finish[source]||after.d.ruinFinisherLast?.route!==names[source])throw new Error('wrong finisher '+JSON.stringify({source,after}));if(after.d.ruinFinisherLast?.forcedKill!==true)throw new Error('low-HP execution was not promoted '+JSON.stringify({source,after}));if(after.hp>0||!after.d.ruinFinisherActive||!after.body.includes('mb-ruin-finisher'))throw new Error('finisher presentation/KO missing '+JSON.stringify({source,after}));if(!after.hud.includes(finish[source]))throw new Error('finisher HUD missing '+JSON.stringify({source,hud:after.hud}));
              await page.screenshot({path:`mirror-break-v14-audit/0${source+1}-${finish[source].toLowerCase().replaceAll(' ','-')}.png`});rows.push({source,route:names[source],finisher:finish[source],chainDamage:damage[source],hp:after.hp,active:after.d.ruinFinisherActive,wave:after.d.ruinFinisherWave});
            }
            const final=await page.evaluate(()=>window.parryMirrorBreakDiagnostics());const finite=await page.evaluate(()=>[player,boss].every(d=>d.nodes.every(n=>Object.values(n.p).every(Number.isFinite))));if(final.ruinFinishers!==4||!finite)throw new Error('final v14 state invalid '+JSON.stringify({final,finite}));if(errors.length)throw new Error(errors.join(' | '));fs.writeFileSync('mirror-break-v14-audit/result.json',JSON.stringify({success:true,rows,finite,errors},null,2));console.log(JSON.stringify({success:true,rows,finite},null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node v14-audit.cjs
      - name: Upload ruin finisher frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parry-doll-mirror-break-v14-ruin-finisher-audit
          path: mirror-break-v14-audit/
          if-no-files-found: error
          retention-days: 3
