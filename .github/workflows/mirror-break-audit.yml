name: MIRROR BREAK Gameplay Audit

on:
  push:
    branches: [main]
    paths:
      - dist/mirror-break-v1.js
      - dist/mirror-break-final-adapter.js
      - dist/mirror-break-v2.js
      - dist/parry-cinematic-v3.js
      - .github/mirror-break.trigger
      - .github/workflows/mirror-break-audit.yml

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser stack
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/parry-mb-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/parry-mb-http.log; exit 1
      - name: Exercise and capture MIRROR BREAK v2 loop
        run: |
          mkdir -p mirror-break-audit
          cat > mb-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader-webgl','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:852,height:393},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('Failed to load resource'))errors.push(m.text())});page.on('response',r=>{if(r.status()>=400&&!r.url().includes('/version.json'))errors.push(`HTTP ${r.status()} ${r.url()}`)});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.parryMirrorBreakDiagnostics?.().v2===true,{timeout:15000});await page.evaluate(()=>document.getElementById('start')?.click());await sleep(350);

            const exposed=await page.evaluate(()=>{for(let i=0;i<2;i++)step(1/60);player.pos.x=boss.pos.x;player.pos.z=boss.pos.z+1.8;player.vel=V();boss.vel=V();boss.stun=0;boss.wind=0;boss.strike=0;boss.invuln=0;player.parry=.50;player.parryCool=0;enemyImpact(null);for(let i=0;i<2;i++)step(1/60);return window.parryMirrorBreakDiagnostics()});
            await sleep(40);await page.screenshot({path:'mirror-break-audit/01-exposed.png'});

            const broken=await page.evaluate(()=>{player.cool=0;player.comboWindow=0;player.pos.x=boss.pos.x;player.pos.z=boss.pos.z+1.55;const attackStarted=playerAttack(),attackVisualStart=window.parryMirrorBreakDiagnostics().attackVisual;player.swingClock=0;resolveSwing();for(let i=0;i<2;i++)step(1/60);return{...window.parryMirrorBreakDiagnostics(),attackStarted,attackVisualStart}});
            await sleep(100);await page.screenshot({path:'mirror-break-audit/02-broken.png'});

            const mid=await page.evaluate(()=>{boss.invuln=0;hurt(boss,999,V(0,8,-30),boss.nodes[1].p);for(let i=0;i<3;i++)step(1/60);const choiceOpen=document.getElementById('mbCoreChoice')?.classList.contains('show'),buttons=[...document.querySelectorAll('.mb-core')].map(b=>b.textContent.trim());document.querySelector('.mb-core')?.click();for(let i=0;i<30;i++)step(1/60);return{choiceOpen,buttons,afterChoice:window.parryMirrorBreakDiagnostics(),nextLevel:level,nextBoss:boss?.spec?.name||''}});

            const final1=await page.evaluate(()=>{window.__mirrorBreakState.cores.EDGE=2;window.__mirrorBreakState.cores.MIRROR=1;window.__mirrorBreakState.cores.PULSE=1;level=4;boss=new Doll(bosses[4]);boss.stun=0;boss.wind=0;boss.strike=0;boss.ai=0;boss.invuln=0;for(let i=0;i<2;i++)step(1/60);startEnemyAttack(ENEMY_MOVES[4][0]);return{pattern:boss.pattern?.name||'',move:{damage:boss.pattern?.damage||0,wind:boss.pattern?.wind||0,force:boss.pattern?.force||0,range:boss.pattern?.range||0},diag:window.parryMirrorBreakDiagnostics(),fullHp:boss.spec.hp||boss.hp}});
            await sleep(80);await page.screenshot({path:'mirror-break-audit/03-final-phase1.png'});
            const phase2=await page.evaluate(fullHp=>{boss.hp=fullHp*.60;for(let i=0;i<2;i++)step(1/60);return window.parryMirrorBreakDiagnostics().finalPhase},final1.fullHp);await sleep(100);await page.screenshot({path:'mirror-break-audit/04-final-phase2.png'});
            const phase3=await page.evaluate(fullHp=>{boss.hp=fullHp*.30;for(let i=0;i<2;i++)step(1/60);return window.parryMirrorBreakDiagnostics().finalPhase},final1.fullHp);await sleep(100);await page.screenshot({path:'mirror-break-audit/05-final-phase3.png'});
            const result={exposed,broken,...mid,finalPattern:final1.pattern,finalMove:final1.move,finalDiag:final1.diag,phase2,phase3,mode:await page.evaluate(()=>mode)};
            fs.writeFileSync('mirror-break-audit/result.json',JSON.stringify({result,errors},null,2));
            if(errors.length)throw new Error('browser errors: '+errors.join(' | '));if(!(exposed.expose>0))throw new Error('PERFECT did not expose target');if(!broken.attackStarted||!(broken.attackVisualStart.active>0))throw new Error('attack echo did not arm');if(!broken.broken||broken.breaks<1)throw new Error('BODY BREAK failed');if(!mid.choiceOpen||mid.buttons.length!==3)throw new Error('core choice failed');if(mid.afterChoice.cores.EDGE!==1||mid.nextLevel!==1)throw new Error('EDGE acquisition/advance failed');if(!final1.diag.finalAdapter||!final1.diag.v2||final1.diag.mirrorDominant!=='EDGE')throw new Error('final adapter/v2 missing');if(!final1.pattern.includes('写刃・'))throw new Error('dominant EDGE copy missing');if(!final1.diag.fullBuildCopied||!final1.diag.secondaryCoreCopy||!final1.diag.synergies.includes('ZERO TRACE'))throw new Error('mixed build copy/synergy failed');if(phase2<2||phase3<3)throw new Error(`final phases failed ${phase2}/${phase3}`);
            console.log(JSON.stringify(result,null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node mb-audit.cjs
      - name: Upload MIRROR BREAK audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parry-doll-mirror-break-audit
          path: mirror-break-audit/
          if-no-files-found: error
          retention-days: 3
