name: N4 B12 controlled 4 versus 8 panel sewing
on:
  push:
    branches: [n4-cloth-sewing-lab]
    paths: ['tools/n4-b12-pattern-data.json','tools/n4-b12-sewing.py','.github/workflows/n4-b12-sewing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sew:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        panels: [4, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.3.2
        run: |
          curl -L --fail --retry 3 -o /tmp/b.tar.xz https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz
          tar -xf /tmp/b.tar.xz -C /tmp
      - name: Simulate B11 measured flat pattern
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python tools/n4-b12-sewing.py -- ${{ matrix.panels }} /tmp/b12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n4-b12-${{ matrix.panels }}panels
          path: /tmp/b12
          retention-days: 14
