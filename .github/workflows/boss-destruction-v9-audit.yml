name: Boss Destruction 2.0 Audit

on:
  push:
    branches: [main]
    paths:
      - dist/mirror-break-v9-boss-destruction.js
      - dist/mirror-break-final-adapter.js
      - .github/workflows/boss-destruction-v9-audit.yml
      - .github/boss-destruction-v9.trigger

permissions:
  contents: read

jobs:
  destruction:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Boss Destruction script
        run: node --check dist/mirror-break-v9-boss-destruction.js
      - name: Install browser stack
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/parry-v9-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/parry-v9-http.log; exit 1
      - name: Verify four destruction profiles and KO physics
        run: |
          mkdir -p boss-destruction-v9-audit
          cat > v9-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader-webgl','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:852,height:393},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'});
            const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('Failed to load resource'))errors.push('console: '+m.text())});page.on('response',r=>{if(r.status()>=400&&!r.url().includes('/version.json'))errors.push(`HTTP ${r.status()} ${r.url()}`)});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.parryMirrorBreakDiagnostics?.().bossDestruction2===true,null,{timeout:60000,polling:100});
            await page.evaluate(()=>document.getElementById('start')?.click());await sleep(300);
            const expected=['BLADELESS SPIN CRASH','HOLLOW TUMBLE','FIVE-LEG CARTWHEEL','BELL TOWER COLLAPSE'];
            const results=[];
            for(let i=0;i<4;i++){
              await page.evaluate(i=>{
                reset(i);mode='play';transition=0;player.hp=100;player.invuln=10;
                const st=window.__mirrorBreakState;st.boss=boss;st.level=i;st.broken=true;st.choice=false;st.choiceFor=i;st.exposeT=0;
                document.getElementById('mbCoreChoice')?.classList.remove('show');
                startEnemyAttack(ENEMY_MOVES[i][0]);
              },i);
              await sleep(260);
              const live=await page.evaluate(()=>window.parryMirrorBreakDiagnostics());
              await page.screenshot({path:`boss-destruction-v9-audit/${i+1}a-live-broken.png`});
              await page.evaluate(i=>{
                boss.invuln=0;const chest=boss.nodes.find(n=>n.name==='chest')||boss.nodes[1];
                const force=i===3?V(22,5,18):V(30,13,21);hurt(boss,boss.hp+40,force,chest.p);
              },i);
              await sleep(330);
              const flight=await page.evaluate(()=>({diag:window.parryMirrorBreakDiagnostics(),finite:boss.nodes.every(n=>[n.p.x,n.p.y,n.p.z,n.prev.x,n.prev.y,n.prev.z].every(Number.isFinite))}));
              await page.screenshot({path:`boss-destruction-v9-audit/${i+1}b-ko-flight.png`});
              await sleep(1450);
              const settled=await page.evaluate(()=>({diag:window.parryMirrorBreakDiagnostics(),finite:boss.nodes.every(n=>[n.p.x,n.p.y,n.p.z,n.prev.x,n.prev.y,n.prev.z].every(Number.isFinite)),hp:boss.hp}));
              await page.screenshot({path:`boss-destruction-v9-audit/${i+1}c-ko-down.png`});
              const row={level:i,expected:expected[i],live,flight,settled};results.push(row);
              if(!live.v9||!live.tacticShift||live.postBreakPoseTicks<=0)throw new Error(`post-break pose missing L${i} `+JSON.stringify(live));
              if(flight.diag.lastSpecialKO!==expected[i]||!flight.finite)throw new Error(`special KO missing L${i} `+JSON.stringify(flight));
              if(settled.hp!==0||!settled.finite||!settled.diag.koLanded)throw new Error(`KO did not settle L${i} `+JSON.stringify(settled));
            }
            const finalDiag=await page.evaluate(()=>window.parryMirrorBreakDiagnostics());
            if(finalDiag.specialKOs<4)throw new Error('not all special KOs counted '+JSON.stringify(finalDiag));
            if(errors.length)throw new Error(errors.join(' | '));
            fs.writeFileSync('boss-destruction-v9-audit/result.json',JSON.stringify({success:true,results,finalDiag,errors},null,2));
            console.log(JSON.stringify({success:true,styles:results.map(r=>r.flight.diag.lastSpecialKO),specialKOs:finalDiag.specialKOs},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node v9-audit.cjs
      - name: Upload destruction frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parry-doll-boss-destruction-v9-audit
          path: boss-destruction-v9-audit/
          if-no-files-found: error
          retention-days: 3
