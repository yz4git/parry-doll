name: Blender anime face v16

on:
  push:
    branches: [main]
    paths:
      - '.github/blender-anime-face-v160.trigger'
      - '.github/workflows/blender-anime-face-v160.yml'
      - 'tools/export-godot-anime-head.gd'
      - 'tools/replace-head-with-anime-donor-v160.py'
      - 'tools/heroine-face-donor-v160.json'
      - 'docs/THIRD_PARTY_FACE_V160.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-anime-face-v160
  cancel-in-progress: false

jobs:
  build-anime-face:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender and Godot 3 runtime
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy curl unzip
          blender --version
          blender --background --python-exit-code 1 --python-expr "import numpy; print('Blender numpy', numpy.__version__)"

          if apt-cache show godot3-server >/dev/null 2>&1; then
            sudo apt-get install -y godot3-server
            echo "GODOT3=godot3-server" >> "$GITHUB_ENV"
          else
            curl -L --fail --retry 3 \
              -o /tmp/godot3.zip \
              https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_server.64.zip
            unzip -q /tmp/godot3.zip -d /tmp/godot3
            chmod +x /tmp/godot3/Godot_v3.5.3-stable_linux_server.64
            echo "GODOT3=/tmp/godot3/Godot_v3.5.3-stable_linux_server.64" >> "$GITHUB_ENV"
          fi

      - name: Clone pinned legal anime-head carrier
        run: |
          set -euxo pipefail
          git clone https://github.com/TjhaiME/Godot-Active-Rigid-Ragdoll.git /tmp/donor
          cd /tmp/donor
          git checkout 5328516c87d56c90e409dfd09b1c7694e37696fb
          test "$(git rev-parse HEAD)" = "5328516c87d56c90e409dfd09b1c7694e37696fb"
          grep -F "head : CC-ATTRIBUTION : David Onizaki" LicenseInfo.txt
          test -s addons/rigidRagdoll/Assets/Shaders/faceUV.png
          test -s addons/rigidRagdoll/Assets/Shaders/faceNormal.png

      - name: Extract donor HeadMesh ArrayMesh to OBJ
        env:
          HEAD_OBJ_OUTPUT: /tmp/anime-head.obj
          HEAD_INCLUDE_BROWS: '0'
        run: |
          set -euxo pipefail
          "$GODOT3" --path /tmp/donor --script "$GITHUB_WORKSPACE/tools/export-godot-anime-head.gd"
          test -s /tmp/anime-head.obj
          grep -q '^v ' /tmp/anime-head.obj
          grep -q '^vt ' /tmp/anime-head.obj
          grep -q '^f ' /tmp/anime-head.obj
          echo "vertices=$(grep -c '^v ' /tmp/anime-head.obj)"
          echo "uvs=$(grep -c '^vt ' /tmp/anime-head.obj)"
          echo "faces=$(grep -c '^f ' /tmp/anime-head.obj)"

      - name: Import current game GLB and replace only the face head shell
        run: |
          set -euxo pipefail
          test -s dist/assets/models/heroine-blender.glb
          cp dist/assets/models/heroine-blender.glb /tmp/heroine-before-v160.glb
          blender --background --python-exit-code 1 \
            --python tools/replace-head-with-anime-donor-v160.py -- \
            --input /tmp/heroine-before-v160.glb \
            --output dist/assets/models/heroine-blender.glb \
            --donor-obj /tmp/anime-head.obj \
            --donor-uv /tmp/donor/addons/rigidRagdoll/Assets/Shaders/faceUV.png \
            --donor-normal /tmp/donor/addons/rigidRagdoll/Assets/Shaders/faceNormal.png \
            --config tools/heroine-face-donor-v160.json

      - name: Re-import v16 hierarchy and density audit
        run: |
          set -euxo pipefail
          test -s dist/assets/models/heroine-blender.glb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/assets/models/heroine-blender.glb')
          data=p.read_bytes()
          assert len(data)>100000, len(data)
          assert data[:4]==b'glTF', data[:4]
          print('GLB bytes', len(data))
          PY
          blender --background --python-exit-code 1 \
            --python tools/replace-head-with-anime-donor-v160.py -- \
            --audit-only \
            --input dist/assets/models/heroine-blender.glb \
            --output dist/assets/models/heroine-blender.glb \
            --donor-obj /tmp/anime-head.obj \
            --donor-uv /tmp/donor/addons/rigidRagdoll/Assets/Shaders/faceUV.png \
            --donor-normal /tmp/donor/addons/rigidRagdoll/Assets/Shaders/faceNormal.png \
            --config tools/heroine-face-donor-v160.json

      - name: Ensure generated model actually changed
        run: |
          set -euxo pipefail
          old="$(sha256sum /tmp/heroine-before-v160.glb | cut -d' ' -f1)"
          new="$(sha256sum dist/assets/models/heroine-blender.glb | cut -d' ' -f1)"
          echo "old=$old"
          echo "new=$new"
          test "$old" != "$new"

      - name: Commit anime-game face v16
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/assets/models/heroine-blender.glb
          if git diff --cached --quiet; then
            echo "No generated model change"
            exit 1
          fi
          git commit -m "feat: rebuild face from CC-BY anime donor v16.0"
          git push
