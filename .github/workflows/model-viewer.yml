name: Heroine Model Viewer

on:
  push:
    branches: [main]
    paths:
      - .github/model-viewer.trigger

permissions:
  contents: write

jobs:
  build-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Implement model viewer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/model-viewer.sh')
          s=p.read_text()
          old=r"ui.write_text(r'''\'use strict\';"
          new="ui.write_text(r'''\"use strict\";"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)

          idx=Path('dist/index.html')
          h=idx.read_text()
          early="bridge.onload=()=>{const fx=document.createElement('script');"
          early_new="bridge.onload=()=>{const viewer=document.createElement('script');viewer.src='./model-viewer.js?v='+version;document.body.appendChild(viewer);const fx=document.createElement('script');"
          late="const cinematic=document.createElement('script');cinematic.src='./parry-cinematic-v3.js?v='+version;cinematic.onload=()=>{const viewer=document.createElement('script');viewer.src='./model-viewer.js?v='+version;document.body.appendChild(viewer)};document.body.appendChild(cinematic)"
          late_new="const cinematic=document.createElement('script');cinematic.src='./parry-cinematic-v3.js?v='+version;document.body.appendChild(cinematic)"
          if early_new not in h:
              if early not in h: raise SystemExit('bridge onload anchor missing')
              h=h.replace(early,early_new)
          if late in h:
              h=h.replace(late,late_new)
          idx.write_text(h)
          PY
          bash .github/scripts/model-viewer.sh
          bash .github/scripts/model-viewer-polish.sh
