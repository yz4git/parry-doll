name: Heroine Model Viewer

on:
  push:
    branches: [main]
    paths:
      - .github/model-viewer.trigger

permissions:
  contents: write

jobs:
  build-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Implement model viewer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/model-viewer.sh')
          s=p.read_text()
          old=r"ui.write_text(r'''\'use strict\';"
          new="ui.write_text(r'''\"use strict\";"
          if old not in s:
              raise SystemExit('model viewer directive anchor missing')
          p.write_text(s.replace(old,new))
          PY
          bash .github/scripts/model-viewer.sh
