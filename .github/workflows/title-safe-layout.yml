name: Title Safe Layout

on:
  push:
    branches: [main]
    paths:
      - .github/title-safe-layout.trigger

permissions:
  contents: write

jobs:
  fix-title-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix title and model viewer entry layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Keep the title overlay pinned to the actual dynamic viewport and centered
          # inside safe areas on iPhone landscape/portrait.
          css = Path('dist/style.css')
          s = css.read_text()
          marker = '/* TITLE SAFE LAYOUT v2 */'
          if marker not in s:
              s += r'''

/* TITLE SAFE LAYOUT v2 */
html,body{width:100dvw;height:100dvh;min-width:0;min-height:0;max-width:none;max-height:none;overflow:hidden}
#overlay{position:fixed;inset:0;width:100dvw;height:100dvh;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:grid;place-items:center;overflow:hidden}
#overlay .panel{box-sizing:border-box;width:min(510px,calc(100dvw - max(14px,env(safe-area-inset-left)) - max(14px,env(safe-area-inset-right)) - 16px));max-width:100%;margin:0 auto}
#titleActions{display:flex;align-items:stretch;gap:8px;width:100%;margin-top:18px}
#titleActions #start{flex:1 1 auto;width:auto;min-width:0;margin-top:0}
#titleActions #modelViewerOpen{flex:0 0 160px;min-width:0;margin:0;position:static!important;left:auto!important;right:auto!important;bottom:auto!important;top:auto!important;transform:none!important}
@media(max-height:500px) and (orientation:landscape){#overlay .panel{padding:7px 22px}#titleActions{margin-top:9px;gap:7px}#titleActions #modelViewerOpen{flex-basis:148px}}
@media(orientation:portrait){#overlay{align-items:center}#overlay .panel{width:min(510px,calc(100dvw - max(14px,env(safe-area-inset-left)) - max(14px,env(safe-area-inset-right)) - 12px));padding:18px 20px}#titleActions{flex-direction:column;gap:8px;margin-top:14px}#titleActions #modelViewerOpen{flex:0 0 auto;width:100%;min-height:44px}#help p{font-size:12px;line-height:1.45}h1{font-size:clamp(36px,12vw,56px)}}
@media(max-width:390px) and (orientation:portrait){#overlay .panel{padding:14px 16px}.panel p{font-size:13px}#help p{font-size:11px;margin:4px 0}#start{padding:13px 16px;font-size:16px}.panel .foot{margin-top:8px}}
'''
          css.write_text(s)

          # 2) Put MODEL VIEWER in the title panel instead of the vulnerable screen corner.
          ui = Path('dist/model-viewer.js')
          u = ui.read_text()
          old_style_start = "#modelViewerOpen{position:fixed;z-index:60;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:auto;margin:0;border:1px solid rgba(210,236,246,.38);background:rgba(11,22,31,.72);color:#eaf8ff;padding:10px 14px;font:600 11px/1.05 system-ui;letter-spacing:.16em;border-radius:3px;backdrop-filter:blur(12px);box-shadow:0 8px 26px rgba(0,0,0,.22)}"
          new_style_start = "#modelViewerOpen{position:static;z-index:auto;width:auto;margin:0;border:1px solid rgba(210,236,246,.38);background:rgba(11,22,31,.72);color:#eaf8ff;padding:10px 12px;font:600 11px/1.05 system-ui;letter-spacing:.13em;border-radius:3px;backdrop-filter:blur(12px);box-shadow:0 8px 26px rgba(0,0,0,.22);white-space:nowrap}"
          if old_style_start in u:
              u = u.replace(old_style_start, new_style_start)
          elif new_style_start not in u:
              raise SystemExit('model viewer fixed-button style anchor missing')

          old_insert = "const open=document.createElement('button');open.id='modelViewerOpen';open.type='button';open.innerHTML='モデルを見る<small>MODEL VIEWER</small>';start.insertAdjacentElement('afterend',open);"
          new_insert = "const open=document.createElement('button');open.id='modelViewerOpen';open.type='button';open.innerHTML='モデルを見る<small>MODEL VIEWER</small>';const titleActions=document.createElement('div');titleActions.id='titleActions';start.parentNode.insertBefore(titleActions,start);titleActions.appendChild(start);titleActions.appendChild(open);"
          if old_insert in u:
              u = u.replace(old_insert, new_insert)
          elif new_insert not in u:
              raise SystemExit('model viewer insertion anchor missing')

          old_hidden = "const gesture=$('modelViewerGesture'),hidden=[document.querySelector('header'),...['bossHud','playerHud','controls','cue','toast','parrySuccessHud'].map(id=>$(id))].filter(Boolean);"
          new_hidden = "const gesture=$('modelViewerGesture'),hidden=[document.querySelector('header'),...['bossHud','playerHud','controls','cue','toast','parrySuccessHud','pbPhaseStrip','pbResolve','pbChain','pbDanger','pbBanner','pbCineBars','pbResolveBurst'].map(id=>$(id))].filter(Boolean);"
          if old_hidden in u:
              u = u.replace(old_hidden, new_hidden)
          ui.write_text(u)

          # 3) Keep the generator source aligned so a future model-viewer rebuild does not regress.
          gen = Path('.github/scripts/model-viewer.sh')
          g = gen.read_text()
          g = g.replace("#modelViewerOpen{margin-top:10px;width:100%;border:1px solid rgba(210,236,246,.34);background:rgba(11,22,31,.58);color:#eaf8ff;padding:12px 16px;font:600 12px/1.1 system-ui;letter-spacing:.18em;border-radius:3px;backdrop-filter:blur(10px)}",
                        "#modelViewerOpen{position:static;width:auto;margin:0;border:1px solid rgba(210,236,246,.38);background:rgba(11,22,31,.72);color:#eaf8ff;padding:10px 12px;font:600 11px/1.05 system-ui;letter-spacing:.13em;border-radius:3px;backdrop-filter:blur(12px);box-shadow:0 8px 26px rgba(0,0,0,.22);white-space:nowrap}")
          g = g.replace("const open=document.createElement('button');open.id='modelViewerOpen';open.type='button';open.innerHTML='モデルを見る<small>MODEL VIEWER</small>';start.insertAdjacentElement('afterend',open);",
                        "const open=document.createElement('button');open.id='modelViewerOpen';open.type='button';open.innerHTML='モデルを見る<small>MODEL VIEWER</small>';const titleActions=document.createElement('div');titleActions.id='titleActions';start.parentNode.insertBefore(titleActions,start);titleActions.appendChild(start);titleActions.appendChild(open);")
          g = g.replace("const gesture=$('modelViewerGesture'),hidden=['header','bossHud','playerHud','controls','cue','toast'].map(id=>$(id)).filter(Boolean);",
                        "const gesture=$('modelViewerGesture'),hidden=[document.querySelector('header'),...['bossHud','playerHud','controls','cue','toast','parrySuccessHud','pbPhaseStrip','pbResolve','pbChain','pbDanger','pbBanner','pbCineBars','pbResolveBurst'].map(id=>$(id))].filter(Boolean);")
          gen.write_text(g)
          PY

          node --check dist/model-viewer.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/style.css dist/model-viewer.js .github/scripts/model-viewer.sh
          if git diff --cached --quiet; then
            echo "No title layout changes needed"
            exit 0
          fi
          git commit -m "fix: keep title and model viewer inside iPhone viewport"
          git push origin main
