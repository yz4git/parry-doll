name: Title Safe Layout

on:
  push:
    branches: [main]
    paths:
      - .github/title-safe-layout.trigger

permissions:
  contents: write

jobs:
  fix-title-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply layout fix
        run: |
          python3 .github/scripts/title-safe-layout.py
          node --check dist/model-viewer.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/style.css dist/model-viewer.js .github/scripts/model-viewer.sh
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: keep title and model viewer inside iPhone viewport"
          git push origin main
