name: Boss Destruction Stage Damage Audit

on:
  push:
    branches: [main]
    paths:
      - dist/mirror-break-v9-boss-destruction.js
      - dist/mirror-break-v10-stage-destruction.js
      - dist/mirror-break-final-adapter.js
      - .github/workflows/boss-destruction-v10-stage-audit.yml
      - .github/boss-destruction-v10.trigger

permissions:
  contents: read

jobs:
  stage-damage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate scripts
        run: |
          node --check dist/mirror-break-v9-boss-destruction.js
          node --check dist/mirror-break-v10-stage-destruction.js
      - name: Install browser stack
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/parry-v10-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/parry-v10-http.log; exit 1
      - name: Verify four persistent stage scars
        run: |
          mkdir -p boss-destruction-v10-audit
          cat > v10-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs=require('fs');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader-webgl','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:852,height:393},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'});
            const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('Failed to load resource'))errors.push('console: '+m.text())});page.on('response',r=>{if(r.status()>=400&&!r.url().includes('/version.json'))errors.push(`HTTP ${r.status()} ${r.url()}`)});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.parryMirrorBreakDiagnostics?.().v10===true,null,{timeout:60000,polling:100});
            await page.evaluate(()=>document.getElementById('start')?.click());await sleep(350);
            const types=['DOJO BEAM BREAK','DUNGEON CAGE BREAK','BELFRY SPINE BREAK','ALTAR COLUMN COLLAPSE'],rows=[];
            for(let i=0;i<4;i++){
              await page.evaluate(i=>{reset(i);mode='play';transition=0;player.hp=100;player.invuln=10;const st=window.__mirrorBreakState;st.boss=boss;st.level=i;st.broken=true;st.choice=false;st.choiceFor=i;document.getElementById('mbCoreChoice')?.classList.remove('show');boss.invuln=0;const chest=boss.nodes.find(n=>n.name==='chest')||boss.nodes[1];hurt(boss,boss.hp+50,i===3?V(18,4,14):V(25,10,17),chest.p)},i);
              await page.waitForFunction(i=>{const d=window.parryBossDestructionStageDiagnostics?.();return d?.events>=i+1&&d?.level===i&&d?.meshes>=10},i,{timeout:5000,polling:50});
              await sleep(520);
              const diag=await page.evaluate(()=>({stage:window.parryBossDestructionStageDiagnostics(),mirror:window.parryMirrorBreakDiagnostics(),finite:boss.nodes.every(n=>[n.p.x,n.p.y,n.p.z,n.prev.x,n.prev.y,n.prev.z].every(Number.isFinite))}));
              await page.screenshot({path:`boss-destruction-v10-audit/${i+1}-stage-damage.png`});rows.push(diag);
              if(!diag.finite||diag.stage.type!==types[i]||diag.stage.meshes<10||!diag.mirror.stageDestruction)throw new Error(`stage damage failed L${i} `+JSON.stringify(diag));
            }
            if(errors.length)throw new Error(errors.join(' | '));fs.writeFileSync('boss-destruction-v10-audit/result.json',JSON.stringify({success:true,rows,errors},null,2));console.log(JSON.stringify({success:true,types:rows.map(r=>r.stage.type),meshes:rows.map(r=>r.stage.meshes)},null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node v10-audit.cjs
      - name: Upload stage-damage frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parry-doll-boss-destruction-v10-audit
          path: boss-destruction-v10-audit/
          if-no-files-found: error
          retention-days: 3
