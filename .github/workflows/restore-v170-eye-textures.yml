name: Restore v17.0 + visible eye texture + iris depth-only fix

on:
  push:
    branches: [main]
    paths:
      - '.github/restore-v170-eye-textures.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-v170-eye-textures
  cancel-in-progress: false

jobs:
  restore-texture-and-lift-iris:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V170_COMMIT: ff135e507f5d44cc4bce6d49915aa4719105dd29
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate v17.0 eye tools
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            tools/add-eye-textures-v170.py \
            tools/audit-v170-eye-textures.py \
            tools/lift-v170-iris-stack.py \
            tools/audit-v170-iris-lift.py \
            tools/paint-v170-faceuv-eyes.py \
            tools/audit-v170-faceuv-eyes.py
          grep -Fq 'geometry_changed": False' tools/add-eye-textures-v170.py
          grep -Fq 'IrisOuterV167' tools/lift-v170-iris-stack.py
          grep -Fq 'non_eye_geometry_unchanged' tools/audit-v170-iris-lift.py
          grep -Fq 'actually sampled v17.0 donor eye UV islands' tools/paint-v170-faceuv-eyes.py

      - name: Restore exact v17.0 shipping model
        run: |
          set -euxo pipefail
          git cat-file -e "$V170_COMMIT^{commit}"
          git show "$V170_COMMIT:dist/assets/models/heroine-blender.glb" > /tmp/heroine-v170-original.glb
          test -s /tmp/heroine-v170-original.glb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/heroine-v170-original.glb'); d=p.read_bytes()
          assert d[:4] == b'glTF', d[:4]
          print('restored exact v17.0 bytes', len(d))
          PY
          mkdir -p dist/assets/models
          cp /tmp/heroine-v170-original.glb dist/assets/models/heroine-blender.glb

      - name: Add eye materials/textures without changing geometry
        run: |
          set -euxo pipefail
          python3 tools/add-eye-textures-v170.py \
            --input /tmp/heroine-v170-original.glb \
            --output dist/assets/models/heroine-blender.glb \
            --manifest /tmp/v170-eye-texture-manifest.json
          cat /tmp/v170-eye-texture-manifest.json

      - name: Prove texture pass keeps exact v17.0 geometry
        run: |
          set -euxo pipefail
          python3 tools/audit-v170-eye-textures.py \
            --original /tmp/heroine-v170-original.glb \
            --patched dist/assets/models/heroine-blender.glb

      - name: Correct only the known buried iris-stack Z depth
        run: |
          set -euxo pipefail
          python3 tools/lift-v170-iris-stack.py \
            --input dist/assets/models/heroine-blender.glb \
            --output dist/assets/models/heroine-blender.glb \
            --manifest /tmp/v170-iris-depth-manifest.json
          cat /tmp/v170-iris-depth-manifest.json

      - name: Paint iris into the actual visible donor eye UV islands
        run: |
          set -euxo pipefail
          python3 tools/paint-v170-faceuv-eyes.py \
            --input dist/assets/models/heroine-blender.glb \
            --output dist/assets/models/heroine-blender.glb \
            --manifest /tmp/v170-visible-eye-manifest.json
          cat /tmp/v170-visible-eye-manifest.json

      - name: Final geometry and eye-texture audits
        run: |
          set -euxo pipefail
          python3 tools/audit-v170-iris-lift.py \
            --original /tmp/heroine-v170-original.glb \
            --patched dist/assets/models/heroine-blender.glb
          python3 tools/audit-v170-faceuv-eyes.py \
            --original /tmp/heroine-v170-original.glb \
            --patched dist/assets/models/heroine-blender.glb

      - name: Commit exact v17.0 with visible textured eyes
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/assets/models/heroine-blender.glb
          if git diff --cached --quiet; then
            echo 'Expected v17.0 eye-texture/depth model change was not produced'
            exit 1
          fi
          git commit -m 'feat: v17.0 visible donor eye texture with depth-only iris fix'
          git pull --rebase origin main
          git push origin main
