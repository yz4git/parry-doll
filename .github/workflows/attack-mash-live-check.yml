name: Live attack mash playcheck

on:
  push:
    branches: [main]
    paths:
      - '.github/attack-mash-live.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Attack-only live playcheck
        env:
          TEST_URL: https://yz4git.github.io/parry-doll/
          MASH_SECONDS: '70'
          MASH_INTERVAL_MS: '110'
        run: node tests/attack-mash-live.mjs | tee attack-mash-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attack-mash-live-check
          path: |
            attack-mash-result.json
            attack-mash-final.png
          retention-days: 7
