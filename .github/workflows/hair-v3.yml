name: Hair v3 Worker

on:
  push:
    branches: [main]
    paths:
      - .github/hair-v3.trigger

permissions:
  contents: write

jobs:
  build-hair-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python authoring dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy
          python - <<'PY'
          import numpy
          print('numpy', numpy.__version__)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and build Hair v3
        run: bash .github/scripts/hair-v3-pass.sh
