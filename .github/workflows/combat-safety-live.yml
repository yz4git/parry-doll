name: Live combat safety check
on:
  push:
    branches: [main]
    paths:
      - '.github/combat-safety-live.trigger'
permissions:
  contents: read
jobs:
  playcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live safety regression
        env:
          TEST_URL: https://yz4git.github.io/parry-doll/
        run: |
          set -o pipefail
          node tests/combat-safety-live.mjs | tee combat-safety-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-safety-live
          path: |
            combat-safety-result.json
            combat-safety-final.png
          retention-days: 7
