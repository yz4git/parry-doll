name: Blender hair donor v18.0

on:
  push:
    branches: [main]
    paths:
      - '.github/hair-donor-v180.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-hair-donor-v180
  cancel-in-progress: false

jobs:
  build-hair-donor-v180:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Blender 4.2
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          BLENDER=/tmp/blender-4.2.0-linux-x64/blender
          test -x "$BLENDER"
          "$BLENDER" --version
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"

      - name: Download CC0 OverScore Proxy 1.5 donor
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            -A 'Mozilla/5.0 parry-doll-hair-authoring/18.0' \
            -o /tmp/proxy_1.5.blend \
            https://opengameart.org/sites/default/files/proxy_1.5.blend
          test -s /tmp/proxy_1.5.blend
          size="$(stat -c%s /tmp/proxy_1.5.blend)"
          echo "donor_bytes=$size"
          test "$size" -gt 10000000
          test "$(sha256sum /tmp/proxy_1.5.blend | cut -d' ' -f1)" = "ac0dcdb2979dab7311e6d95ce6b1b20b118ef80d4de1f69aa9e88f733111b5ea"

      - name: Validate hair-only authoring scripts
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            tools/build-hair-donor-v180.py \
            tools/build-hair-donor-v180-safe.py \
            tools/audit-hair-donor-v180-safe.py
          grep -Fq 'ToeCap' tools/build-hair-donor-v180-safe.py
          grep -Fq 'canonical world points' tools/audit-hair-donor-v180-safe.py
          grep -Fq 'High Ponytail' docs/HAIR_DONOR_V180.md

      - name: Build hair-only v18.0 GLB
        run: |
          set -euxo pipefail
          test -s dist/assets/models/heroine-blender.glb
          cp dist/assets/models/heroine-blender.glb /tmp/heroine-before-hair-v180.glb
          sha256sum /tmp/heroine-before-hair-v180.glb
          "$BLENDER" --background --python-exit-code 1 --python tools/build-hair-donor-v180-safe.py -- \
            --input dist/assets/models/heroine-blender.glb \
            --output dist/assets/models/heroine-blender.glb \
            --donor /tmp/proxy_1.5.blend \
            --report dist/hair-donor-v180-build.json
          test -s dist/assets/models/heroine-blender.glb
          test -s dist/hair-donor-v180-build.json
          ! grep -Fq 'ToeCapL' dist/hair-donor-v180-build.json
          ! grep -Fq 'ToeCapR' dist/hair-donor-v180-build.json
          sha256sum dist/assets/models/heroine-blender.glb

      - name: Audit that face is unchanged after export
        run: |
          set -euxo pipefail
          "$BLENDER" --background --python-exit-code 1 --python tools/audit-hair-donor-v180-safe.py -- \
            --before /tmp/heroine-before-hair-v180.glb \
            --after dist/assets/models/heroine-blender.glb \
            --report dist/hair-donor-v180-audit.json
          python3 -m json.tool dist/hair-donor-v180-build.json >/dev/null
          python3 -m json.tool dist/hair-donor-v180-audit.json >/dev/null
          grep -Fq '"face_unchanged": true' dist/hair-donor-v180-audit.json
          git diff --check

      - name: Commit edited game hair
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            dist/assets/models/heroine-blender.glb \
            dist/hair-donor-v180-build.json \
            dist/hair-donor-v180-audit.json
          git diff --cached --quiet && { echo 'No generated v18.0 hair change'; exit 1; }
          git commit -m 'feat: replace heroine hair with CC0 high ponytail v18.0'
          git pull --rebase origin main
          git push origin main
