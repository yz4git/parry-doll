name: Inspect David Onizaki donor face texture

on:
  push:
    branches: [main]
    paths:
      - '.github/donor-faceuv-inspect.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned donor texture
        run: |
          set -euxo pipefail
          git clone -q https://github.com/TjhaiME/Godot-Active-Rigid-Ragdoll.git /tmp/donor
          cd /tmp/donor
          git checkout -q 5328516c87d56c90e409dfd09b1c7694e37696fb
          cp addons/rigidRagdoll/Assets/Shaders/faceUV.png "$GITHUB_WORKSPACE/faceUV.png"
          file "$GITHUB_WORKSPACE/faceUV.png"
      - uses: actions/upload-artifact@v4
        with:
          name: david-onizaki-faceuv
          path: faceUV.png
          retention-days: 3
