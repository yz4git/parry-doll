name: Combat safety v1
on:
  push:
    branches: [main]
    paths:
      - '.github/combat-safety-v1.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply combat safety patch
        run: python tools/apply-combat-safety-v1.py
      - name: Validate JavaScript
        run: node --check dist/dodge-system-v1.js
      - name: Validate safety invariants
        run: |
          grep -q 'MAX_PLAYER_HIT=28' dist/dodge-system-v1.js
          grep -q 'PLAYER_HIT_IFRAME=.48' dist/dodge-system-v1.js
          grep -q 'recovered frame' dist/dodge-system-v1.js
          grep -q 'MAX_PARTICLES=220' dist/dodge-system-v1.js
          grep -q 'window.parrySafetyTest' dist/dodge-system-v1.js
      - name: Commit safety patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/dodge-system-v1.js
          git commit -m 'fix: prevent one-shot failures and recover runaway frames'
          git push
