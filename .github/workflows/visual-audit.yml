name: Visual WebGL Audit

on:
  push:
    branches: [visual-audit-20260909]
    paths:
      - .github/workflows/visual-audit.yml
      - dist/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parry-doll-visual-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and desktop capture
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
      - name: Serve game
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/parry-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/parry-http.log; exit 1
      - name: Capture real WebGL gameplay from X desktop
        run: |
          mkdir -p visual-audit
          cat > audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async()=>{
            const browser=await chromium.launch({headless:false,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader-webgl','--disable-dev-shm-usage','--window-position=0,0','--window-size=852,393','--disable-infobars']});
            const context=await browser.newContext({viewport:{width:852,height:393},deviceScaleFactor:1,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            const tap=id=>page.evaluate(id=>{const b=document.getElementById(id);if(!b)return false;const o={bubbles:true,pointerId:7,pointerType:'touch',isPrimary:true};b.dispatchEvent(new PointerEvent('pointerdown',o));b.dispatchEvent(new PointerEvent('pointerup',o));return true},id);
            const shot=path=>execFileSync('import',['-window','root',path],{timeout:5000,stdio:'ignore'});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForSelector('#start',{timeout:12000});await sleep(2200);
            const webgl=await page.evaluate(()=>{const c=document.getElementById('visual-scene');const gl=c&&(c.getContext('webgl2')||c.getContext('webgl'));return{canvas:!!c,renderer:gl?gl.getParameter(gl.RENDERER):null,width:c?.width||0,height:c?.height||0}});
            await tap('start');await sleep(1200);shot('visual-audit/01-fight-open.png');
            await page.keyboard.down('KeyW');await sleep(900);await page.keyboard.up('KeyW');await page.keyboard.down('KeyD');await sleep(360);await page.keyboard.up('KeyD');await sleep(160);shot('visual-audit/02-approach.png');
            await tap('attack');await sleep(130);shot('visual-audit/03-attack.png');await sleep(520);await tap('attack');await sleep(150);shot('visual-audit/04-second-attack.png');
            let parryCaptured=false,success=false;
            for(let i=0;i<100;i++){const s=await page.evaluate(()=>{const cue=document.getElementById('cue'),stats=document.getElementById('stats');return{opacity:+getComputedStyle(cue).opacity||0,text:cue.textContent||'',stats:stats.textContent||''}});if(s.opacity>.18||/PARRY|弾|危|!/i.test(s.text)){await tap('parry');if(!parryCaptured){await sleep(65);shot('visual-audit/05-parry.png');parryCaptured=true}}if(/PARRY\s+[1-9]/i.test(s.stats)){success=true;break}await sleep(45)}
            await sleep(250);shot('visual-audit/06-late-fight.png');
            const diag=await page.evaluate(webgl=>({stats:document.getElementById('stats')?.textContent||'',boss:document.getElementById('bossName')?.textContent||'',phase:window.parryPhaseBreakDiagnostics?.()||null,snapshot:window.parryDoll?.snapshot?.()||null,webgl}),webgl);
            fs.writeFileSync('visual-audit/audit.json',JSON.stringify({diag,errors,success},null,2));console.log(JSON.stringify({diag,errors,success},null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          xvfb-run -a --server-args='-screen 0 852x393x24' node audit.cjs
      - name: Upload audit frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parry-doll-webgl-audit
          path: visual-audit/
          if-no-files-found: error
          retention-days: 3
