name: MIRROR BREAK v13 Chain UI Audit

on:
  push:
    branches: [main]
    paths:
      - dist/mirror-break-v13-chain-destruction.js
      - .github/workflows/mirror-break-v13-ui-audit.yml

permissions:
  contents: read

jobs:
  chain-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate v13
        run: node --check dist/mirror-break-v13-chain-destruction.js
      - name: Install browser stack
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/parry-v13-ui-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/parry-v13-ui-http.log; exit 1
      - name: Verify ALTAR RIFT chain presentation priority
        run: |
          mkdir -p mirror-break-v13-ui-audit
          cat > v13-ui-audit.cjs <<'NODE'
          const { chromium }=require('playwright');const fs=require('fs');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader-webgl','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:852,height:393},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'});
            const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('Failed to load resource'))errors.push('console: '+m.text())});page.on('response',r=>{if(r.status()>=400&&!r.url().includes('/version.json'))errors.push(`HTTP ${r.status()} ${r.url()}`)});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.parryMirrorBreakDiagnostics?.().v13===true,null,{timeout:60000,polling:100});await page.evaluate(()=>document.getElementById('start')?.click());await sleep(300);
            await page.evaluate(()=>{const hit={serial:913,level:3,style:'BELL TOWER COLLAPSE',part:'bellArm',kind:'ARM',label:'chain-ui',x:.9,z:-2.6,power:2.4,time:performance.now()};window.__mirrorBreakV9State.stageHitSerial=hit.serial;window.__mirrorBreakV9State.stageHit=hit;reset(4);mode='play';transition=0;player.hp=100;player.invuln=10;player.stun=0;boss.hp=Math.max(100,boss.spec.hp*.7);boss.invuln=0;boss.ai=999;boss.wind=0;boss.strike=0;boss.stun=0;boss.down=0;boss.pattern=null});
            await sleep(360);await page.evaluate(()=>{const t={x:0,z:-4.05},ch=boss.nodes.find(n=>n.name==='chest')||boss.nodes[0];hurt(boss,1,V(35,4,-3),ch.p);const dx=t.x-ch.p.x,dz=t.z-ch.p.z;boss.pos.x+=dx;boss.pos.z+=dz;for(const n of boss.nodes){n.p.x+=dx;n.prev.x+=dx;n.p.z+=dz;n.prev.z+=dz}step(1/60)});await sleep(980);
            const ui=await page.evaluate(()=>{const d=window.parryMirrorBreakDiagnostics(),shift=document.getElementById('mbMirrorShift'),cs=shift?getComputedStyle(shift):null;return{triggers:d.chainTriggers,route:d.chainLast?.route,priority:d.chainUiPriority,detached:d.chainMirrorDetached,attached:!!shift,opacity:cs?.opacity||null,visibility:cs?.visibility||null,shiftText:shift?.textContent||'',bodyClass:document.body.className}});
            await page.screenshot({path:'mirror-break-v13-ui-audit/altar-rift-chain-priority.png'});fs.writeFileSync('mirror-break-v13-ui-audit/result.json',JSON.stringify({success:true,ui,errors},null,2));
            if(ui.triggers!==1||ui.route!=='ALTAR RIFT')throw new Error('ALTAR RIFT chain missing '+JSON.stringify(ui));if(!ui.priority)throw new Error('chain UI priority expired too early '+JSON.stringify(ui));if(ui.attached&&(Number(ui.opacity)>.01||ui.visibility!=='hidden'))throw new Error('MIRROR SHIFT still visible in DOM during chain '+JSON.stringify(ui));if(!ui.attached&&!ui.detached)throw new Error('MIRROR SHIFT unexpectedly missing without detach state '+JSON.stringify(ui));if(errors.length)throw new Error(errors.join(' | '));
            console.log(JSON.stringify({success:true,ui},null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node v13-ui-audit.cjs
      - name: Upload UI frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parry-doll-mirror-break-v13-ui-audit
          path: mirror-break-v13-ui-audit/
          if-no-files-found: error
          retention-days: 3
