name: MIRROR BREAK v13 Chain Destruction Audit

on:
  push:
    branches: [main]
    paths:
      - dist/mirror-break-v13-chain-destruction.js
      - dist/mirror-break-final-adapter.js
      - .github/workflows/mirror-break-v13-chain-audit.yml

permissions:
  contents: read

jobs:
  chain-destruction:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate v13
        run: |
          node --check dist/mirror-break-v13-chain-destruction.js
          node --check dist/mirror-break-final-adapter.js
      - name: Install browser stack
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/parry-v13-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/parry-v13-http.log; exit 1
      - name: Verify inherited ruin chain destruction
        run: |
          mkdir -p mirror-break-v13-audit
          cat > v13-audit.cjs <<'NODE'
          const { chromium }=require('playwright');const fs=require('fs');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader-webgl','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:852,height:393},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'});
            const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('Failed to load resource'))errors.push('console: '+m.text())});page.on('response',r=>{if(r.status()>=400&&!r.url().includes('/version.json'))errors.push(`HTTP ${r.status()} ${r.url()}`)});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.parryMirrorBreakDiagnostics?.().v13===true,null,{timeout:60000,polling:100});await page.evaluate(()=>document.getElementById('start')?.click());await sleep(300);
            const names=['ASH GATE','CAGE BREACH','BROKEN SPINE','ALTAR RIFT'],styles=['BLADELESS SPIN CRASH','HOLLOW TUMBLE','FIVE-LEG CARTWHEEL','BELL TOWER COLLAPSE'],rows=[];
            for(let source=0;source<4;source++){
              await page.evaluate(({source,style})=>{const hit={serial:700+source,level:source,style,part:['swordArm','foreLeg','spearLeg','bellArm'][source],kind:['ARM','LEG','LEG','ARM'][source],label:'chain',x:(source-1.5)*.6,z:-2-source*.22,power:1.7+source*.2,time:performance.now()};window.__mirrorBreakV9State.stageHitSerial=hit.serial;window.__mirrorBreakV9State.stageHit=hit;reset(source+1);mode='play';transition=0;player.hp=100;player.invuln=10;player.stun=0;boss.hp=Math.max(80,boss.spec.hp*.65);boss.invuln=0;boss.ai=999;boss.wind=0;boss.strike=0;boss.stun=0;boss.down=0;boss.pattern=null},{source,style:styles[source]});
              await sleep(350);const before=await page.evaluate(()=>{const vs=window.__mirrorBreakV13State.scene,ms=vs?.__mbDestructionRoute?.meshes||[];return{diag:window.parryMirrorBreakDiagnostics(),m:ms.map(x=>[x.position.x,x.position.y,x.position.z,x.rotation.x,x.rotation.z])}});if(before.diag.routeName!==names[source]||before.m.length<8)throw new Error('route not ready '+JSON.stringify({source,diag:before.diag,count:before.m.length}));
              const hpBefore=await page.evaluate(source=>{const t=source===3?{x:0,z:-4.05}:{x:(source%2?1:-1)*3.6,z:-5.35},ch=boss.nodes.find(n=>n.name==='chest')||boss.nodes[0];hurt(boss,1,V(28+source*2,4,-3),ch.p);const dx=t.x-ch.p.x,dz=t.z-ch.p.z;boss.pos.x+=dx;boss.pos.z+=dz;for(const n of boss.nodes){n.p.x+=dx;n.prev.x+=dx;n.p.z+=dz;n.prev.z+=dz}const hp=boss.hp;step(1/60);return hp},source);
              await sleep(820);const after=await page.evaluate(()=>{const vs=window.__mirrorBreakV13State.scene,ms=vs?.__mbDestructionRoute?.meshes||[];return{diag:window.parryMirrorBreakDiagnostics(),hp:boss.hp,m:ms.map(x=>[x.position.x,x.position.y,x.position.z,x.rotation.x,x.rotation.z])}});if(after.diag.chainTriggers!==source+1||after.diag.chainLast?.source!==source||after.diag.chainLast?.route!==names[source])throw new Error('chain did not trigger '+JSON.stringify({source,diag:after.diag}));if(!(after.hp<hpBefore))throw new Error('secondary damage missing '+JSON.stringify({source,hpBefore,hpAfter:after.hp}));if(!after.diag.chainCollapseSettled)throw new Error('collapse did not settle '+JSON.stringify({source,diag:after.diag}));let moved=0;for(let i=0;i<Math.min(before.m.length,after.m.length);i++)for(let j=0;j<5;j++)moved+=Math.abs((after.m[i]?.[j]||0)-(before.m[i]?.[j]||0));if(moved<.45)throw new Error('route meshes did not collapse '+JSON.stringify({source,moved}));
              const once=after.diag.chainTriggers;await page.evaluate(source=>{boss.invuln=0;const ch=boss.nodes.find(n=>n.name==='chest')||boss.nodes[0];hurt(boss,1,V(31,4,-3),ch.p);step(1/60)},source);await sleep(120);const repeat=await page.evaluate(()=>window.parryMirrorBreakDiagnostics().chainTriggers);if(repeat!==once)throw new Error('route chained more than once '+JSON.stringify({source,once,repeat}));
              rows.push({source,route:names[source],damage:after.diag.chainLast.damage,power:after.diag.chainLast.power,moved:+moved.toFixed(3),hpBefore:+hpBefore.toFixed(1),hpAfter:+after.hp.toFixed(1)});await page.screenshot({path:`mirror-break-v13-audit/0${source+1}-${names[source].toLowerCase().replaceAll(' ','-')}-chain.png`});
            }
            const final=await page.evaluate(()=>window.parryMirrorBreakDiagnostics());const finite=await page.evaluate(()=>[player,boss].every(d=>d.nodes.every(n=>Object.values(n.p).every(Number.isFinite))));if(final.chainTriggers!==4||final.chainHistory.length!==4)throw new Error('chain history mismatch '+JSON.stringify(final));if(!finite)throw new Error('non-finite chain state');if(errors.length)throw new Error(errors.join(' | '));fs.writeFileSync('mirror-break-v13-audit/result.json',JSON.stringify({success:true,rows,final:{triggers:final.chainTriggers,consumed:final.chainConsumed},finite,errors},null,2));console.log(JSON.stringify({success:true,rows,final:final.chainTriggers},null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node v13-audit.cjs
      - name: Upload chain frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parry-doll-mirror-break-v13-chain-audit
          path: mirror-break-v13-audit/
          if-no-files-found: error
          retention-days: 3
