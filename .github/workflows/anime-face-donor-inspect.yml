name: Anime face donor inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/anime-face-donor-inspect.trigger'
      - '.github/workflows/anime-face-donor-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-donor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned CC-BY anime head source
        run: |
          set -euxo pipefail
          git clone https://github.com/TjhaiME/Godot-Active-Rigid-Ragdoll.git /tmp/donor
          cd /tmp/donor
          git checkout 5328516c87d56c90e409dfd09b1c7694e37696fb
          git rev-parse HEAD
      - name: Inspect scene resources and head candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/donor/addons/rigidRagdoll/Characters/GeneralRagdoll_Simple.tscn')
          lines=p.read_text(errors='replace').splitlines()
          print('TSCN lines', len(lines), 'bytes', p.stat().st_size)
          needles=('head','face','meshinstance3d','arraymesh','skin','eyes','eye')
          hits=[]
          for i,line in enumerate(lines):
            low=line.lower()
            if any(n in low for n in needles):
              hits.append(i)
          shown=[]
          for i in hits:
            if any(abs(i-j)<8 for j in shown):
              continue
            shown.append(i)
            print('\n--- context', i+1, '---')
            for j in range(max(0,i-5), min(len(lines),i+11)):
              s=lines[j]
              if len(s)>500: s=s[:500]+' ...<trimmed>'
              print(f'{j+1}: {s}')
            if len(shown)>=40: break
          print('contexts shown', len(shown), 'raw hits', len(hits))
          PY
      - name: Show license lines
        run: |
          sed -n '1,120p' /tmp/donor/LicenseInfo.txt
