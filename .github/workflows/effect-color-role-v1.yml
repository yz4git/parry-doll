name: Combat effect color roles v1
on:
  push:
    branches: [main]
    paths:
      - '.github/effect-color-role-v1.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply effect color roles
        run: python tools/effect-color-role-v1.py
      - name: Validate JavaScript
        run: |
          set -e
          for f in dist/*.js; do node --check "$f" >/dev/null; done
      - name: Validate reserved telegraph colors
        run: |
          grep -q "const CYAN='#67ddff'" dist/dodge-system-v1.js
          grep -q "DODGE_SUCCESS='#ff5ca4'" dist/dodge-system-v1.js
          grep -q "rgba(103,221,255" dist/dodge-system-v1.js
          grep -q "◇" dist/game.js
      - name: Commit color-role patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: reserve yellow and cyan for parry dodge telegraphs'
          git push
