name: Deploy Parry Doll to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - dist/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static Pages artifact
        run: |
          rm -rf out
          mkdir -p out
          cp -R dist/. out/
          printf '{"build":"%s"}\n' "$GITHUB_SHA" > out/version.json
          touch out/.nojekyll
          test -f out/index.html
          test -f out/game.js
          test -f out/style.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
