name: Phase text brief impact v1
on:
  push:
    branches: [main]
    paths:
      - '.github/phase-text-impact-v1.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply brief phase impact tuning
        run: python3 tools/tune-phase-text-impact-v1.py
      - name: Validate JavaScript
        run: node --check dist/phase-break.js
      - name: Validate non-blocking impact
        run: |
          grep -q "hitstop=Math.max(hitstop,next===3?.055:.035)" dist/phase-break.js
          grep -q "feel.slow=Math.max(feel.slow,next===3?.10:.07)" dist/phase-break.js
          ! grep -q "boss.stun=Math.max(boss.stun,next===3?1.22:1.02)" dist/phase-break.js
      - name: Commit tuning
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/phase-break.js
          git commit -m 'fix: retain brief phase hitstop without pausing combat'
          git push
