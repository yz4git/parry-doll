<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151c"><title>PARRY DOLL</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="game" aria-label="パリィドール戦闘フィールド"></canvas>
<header><div class="brand">PARRY <b>DOLL</b><small id="round">THE FALLEN COURT</small></div><button id="pause" aria-label="一時停止">Ⅱ</button><button id="sound" aria-label="音の切り替え">音 ON</button></header>
<section id="bossHud"><div><span id="bossName">灰の剣士</span><small id="phase">01 / 04</small></div><div class="bar"><i id="bossHP"></i></div><div class="posture"><i id="posture"></i></div></section>
<div id="cue"></div><div id="toast"></div>
<div id="playerHud"><span>YOUR VITALITY</span><div class="bar"><i id="playerHP"></i></div><small id="stats">PARRY 0</small></div>
<div id="controls"><div id="stick" aria-label="移動スティック"><div id="knob"></div></div><div class="actions"><button id="attack">斬る<small>ATTACK</small></button><button id="parry">弾く<small>PARRY</small></button></div></div>
<div id="overlay"><div class="panel"><small id="eyebrow">ACTIVE RAGDOLL • BOSS RUSH</small><h1 id="title">PARRY <em>DOLL</em></h1><p id="description">ぐにゃりと受けて、鮮やかに弾く。<br>四体の異形を打ち倒せ。</p><div id="help"><p><b>移動</b> 左スティック / WASD</p><p><b>斬る</b> 攻撃 / J　連打で三連撃</p><p><b>弾く</b> パリィ / K　金色の合図に合わせる</p><p>体勢を崩したら、接近して「斬る」で決着の一撃。</p></div><button id="start">戦いを始める <span>→</span></button><small class="foot">横画面推奨 · 音ありでプレイ</small></div></div>
<script src="game.js"></script></body></html>
