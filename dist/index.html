<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151c"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>PARRY DOLL</title></head><body>
<!-- GitHub Pages deployment shell: version.json drives cache busting. -->
<script>
(()=>{
  const prevent=e=>e.preventDefault();
  for(const type of ['gesturestart','gesturechange','gestureend'])document.addEventListener(type,prevent,{passive:false});
  document.addEventListener('touchstart',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
  document.addEventListener('touchmove',prevent,{passive:false});
  document.addEventListener('dblclick',prevent,{passive:false});
  let lastTouchEnd=0;
  document.addEventListener('touchend',e=>{const now=performance.now();if(now-lastTouchEnd<350)e.preventDefault();lastTouchEnd=now},{passive:false});
  const pinOrigin=()=>{if(window.scrollX!==0||window.scrollY!==0)window.scrollTo(0,0)};
  window.addEventListener('scroll',pinOrigin,{passive:true});
  window.addEventListener('pageshow',pinOrigin,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(pinOrigin,0),{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('scroll',pinOrigin,{passive:true});
    window.visualViewport.addEventListener('resize',pinOrigin,{passive:true});
  }
})();
</script>
<canvas id="game" aria-label="パリィドール戦闘フィールド"></canvas>
<header><div class="brand">PARRY <b>DOLL</b><small id="round">THE FALLEN COURT</small></div><button id="pause" aria-label="一時停止">Ⅱ</button><button id="motion" aria-label="演出強度の切り替え">演出 標準</button><button id="sound" aria-label="音の切り替え">音 ON</button></header>
<section id="bossHud"><div><span id="bossName">灰の剣士</span><small id="phase">01 / 04</small></div><div class="bar"><i id="bossHP"></i></div><div class="posture"><i id="posture"></i></div></section>
<div id="cue"></div><div id="toast"></div>
<div id="playerHud"><span>YOUR VITALITY</span><div class="bar"><i id="playerHP"></i></div><small id="stats">PARRY 0</small></div>
<div id="controls"><div id="stick" aria-label="移動スティック"><div id="knob"></div></div><div class="actions"><button id="attack">斬る<small>ATTACK</small></button><button id="parry">弾く<small>PARRY</small></button></div></div>
<div id="overlay"><div class="panel"><small id="eyebrow">ACTIVE RAGDOLL • BOSS RUSH</small><h1 id="title">PARRY <em>DOLL</em></h1><p id="description">ぐにゃりと受けて、鮮やかに弾く。<br>四体の異形を打ち倒せ。</p><div id="help"><p><b>移動</b> 左スティック / WASD</p><p><b>斬る</b> 攻撃 / J　袈裟斬り → 斬り上げ → 叩き斬り</p><p><b>弾く</b> パリィ / K　金色の合図に合わせる</p><p>弾いた直後の「斬る」で強化反撃。体勢を崩すと決着の一撃。</p></div><button id="start">戦いを始める <span>→</span></button><small class="foot">横画面推奨 · 音ありでプレイ</small></div></div>
<script>
(async()=>{
  const prefix='parry-doll-';
  const scopeMarker='/parry-doll/';
  const now=Date.now();
  let build='dev-'+now;
  try{
    const response=await fetch('./version.json?t='+now,{cache:'no-store'});
    if(response.ok){
      const data=await response.json();
      if(data&&typeof data.build==='string'&&data.build)build=data.build;
    }
  }catch(_){/* local/offline fallback intentionally uses a fresh cache key */}

  const previous=localStorage.getItem('parry-doll-build');
  if(previous!==build){
    try{
      if('caches' in window){
        const names=await caches.keys();
        await Promise.all(names.filter(name=>name.startsWith(prefix)).map(name=>caches.delete(name)));
      }
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(reg=>reg.scope.includes(scopeMarker)).map(reg=>reg.unregister()));
      }
    }catch(_){/* cache cleanup must never block the game */}
    localStorage.setItem('parry-doll-build',build);
  }

  const version=encodeURIComponent(build);
  const css=document.createElement('link');
  css.rel='stylesheet';
  css.href='./style.css?v='+version;
  document.head.appendChild(css);
  const script=document.createElement('script');
  script.src='./game.js?v='+version;
  script.onload=()=>{
    const upgrades=document.createElement('script');
    upgrades.src='./review-upgrades.js?v='+version;
    upgrades.onload=()=>{
      const reactions=document.createElement('script');
      reactions.src='./damage-reactions.js?v='+version;
      document.body.appendChild(reactions);
    };
    document.body.appendChild(upgrades);
  };
  document.body.appendChild(script);
})();
</script></body></html>
